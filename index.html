<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国消除战记</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- 战斗区域 -->
        <div class="battle-area">
            <!-- 顶部双血条 -->
            <div class="hp-panel">
                <div class="hp-side hp-left">
                    <div class="hp-portrait hp-portrait-ally" id="allyPortrait"></div>
                    <div class="hp-main">
                        <div class="hp-row">
                            <span class="hp-name">玩家</span>
                            <span class="hp-text" id="playerHpText">100/100</span>
                        </div>
                        <div class="hp-bar-track">
                            <div class="hp-bar-fill player-hp-fill" id="playerHpBar" style="width:100%"></div>
                        </div>
                    </div>
                </div>
                <div class="hp-center">VS</div>
                <div class="hp-side hp-right">
                    <div class="hp-main">
                        <div class="hp-row hp-row-right">
                            <span class="hp-text" id="enemyHpText">100/100</span>
                            <span class="hp-name" id="enemyNameTop">敌方</span>
                        </div>
                        <div class="hp-bar-track">
                            <div class="hp-bar-fill enemy-hp-fill" id="enemyHpBar" style="width:100%"></div>
                        </div>
                    </div>
                    <div class="hp-portrait hp-portrait-enemy" id="enemyPortrait"></div>
                </div>
            </div>

            <!-- 关卡信息条 -->
            <div class="battle-info">
                <span class="level-badge">第 <span id="level">1</span> 关 / 10</span>
            </div>

            <!-- 战场：左我方 / 右敌方 -->
            <div class="battle-scene" id="scene">
                <div class="stage-bg"></div>

                <!-- 我方阵营（左） -->
                <div class="side side-ally">
                    <div class="q-hero hero-liubei">
                        <img class="hero-img" src="role/刘备.png" alt="刘备">
                        <div class="hero-name">刘备</div>
                    </div>
                    <div class="q-hero hero-zhaoyun">
                        <img class="hero-img" src="role/赵云.png" alt="赵云">
                        <div class="hero-name">赵云</div>
                    </div>
                    <div class="q-hero hero-zhugeliang">
                        <img class="hero-img" src="role/诸葛亮.png" alt="诸葛亮">
                        <div class="hero-name">诸葛亮</div>
                    </div>
                </div>

                <!-- 敌方阵营（右） -->
                <div class="side side-enemy" id="enemies">
                    <div class="q-hero q-enemy">
                        <img class="hero-img enemy-img" id="enemyImg" src="role/黄月英.png" alt="敌方">
                        <div class="hero-name" id="enemyName">黄月英</div>
                    </div>
                </div>

                <!-- 战斗日志 -->
                <div class="battle-log" id="battleLog"></div>
            </div>
        </div>

        <!-- 消除区域 -->
        <div class="match-area">
            <div class="match-info">
                <div class="info-item info-heal">❤️ 回血 <span id="healAmount">0</span></div>
                <div class="info-item info-combo">✨ <span id="combo">0</span>绿</div>
                <div class="info-item info-attack">⚔️ <span id="attackPower">0</span></div>
            </div>
            <div class="grid-container">
                <div class="grid-inner">
                    <div class="grid" id="grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS文件 -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/match.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
