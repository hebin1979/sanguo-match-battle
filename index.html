<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涓夊浗娑堥櫎鎴樿</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- 鎴樻枟鍖哄煙 -->
        <div class="battle-area">
            <!-- 椤堕儴鍙岃鏉?-->
            <div class="hp-panel">
                <div class="hp-side hp-left">
                    <div class="hp-portrait hp-portrait-ally" id="allyPortrait"></div>
                    <div class="hp-main">
                        <div class="hp-row">
                            <span class="hp-name">鐜╁</span>
                            <span class="hp-text" id="playerHpText">100/100</span>
                        </div>
                        <div class="hp-bar-track">
                            <div class="hp-bar-fill player-hp-fill" id="playerHpBar" style="width:100%"></div>
                        </div>
                    </div>
                </div>
                <div class="hp-center">VS</div>
                <div class="hp-side hp-right">
                    <div class="hp-main">
                        <div class="hp-row hp-row-right">
                            <span class="hp-text" id="enemyHpText">100/100</span>
                            <span class="hp-name" id="enemyNameTop">鏁屾柟</span>
                        </div>
                        <div class="hp-bar-track">
                            <div class="hp-bar-fill enemy-hp-fill" id="enemyHpBar" style="width:100%"></div>
                        </div>
                    </div>
                    <div class="hp-portrait hp-portrait-enemy" id="enemyPortrait"></div>
                </div>
            </div>

            <!-- 鍏冲崱淇℃伅鏉?-->
            <div class="battle-info">
                <span class="level-badge">绗?<span id="level">1</span> 鍏?/ 10</span>
            </div>

            <!-- 鎴樺満锛氬乏鎴戞柟 / 鍙虫晫鏂?-->
            <div class="battle-scene" id="scene">
                <div class="stage-bg"></div>

                <!-- 鎴戞柟闃佃惀锛堝乏锛?-->
                <div class="side side-ally">
                    <div class="q-hero hero-liubei">
                        <img class="hero-img" src="role/鍒樺.png" alt="鍒樺">
                        <div class="hero-name">鍒樺</div>
                    </div>
                    <div class="q-hero hero-zhaoyun">
                        <img class="hero-img" src="role/璧典簯.png" alt="璧典簯">
                        <div class="hero-name">璧典簯</div>
                    </div>
                    <div class="q-hero hero-zhugeliang">
                        <img class="hero-img" src="role/璇歌憶浜?png" alt="璇歌憶浜?>
                        <div class="hero-name">璇歌憶浜?/div>
                    </div>
                </div>

                <!-- 鏁屾柟闃佃惀锛堝彸锛?-->
                <div class="side side-enemy" id="enemies">
                    <div class="q-hero q-enemy">
                        <img class="hero-img enemy-img" id="enemyImg" src="role/榛勬湀鑻?png" alt="鏁屾柟">
                        <div class="hero-name" id="enemyName">榛勬湀鑻?/div>
                    </div>
                </div>

                <!-- 鎴樻枟鏃ュ織 -->
                <div class="battle-log" id="battleLog"></div>
            </div>
        </div>

        <!-- 娑堥櫎鍖哄煙 -->
        <div class="match-area">
            <div class="match-info">
                <div class="info-item info-heal">鉂わ笍 鍥炶 <span id="healAmount">0</span></div>
                <div class="info-item info-combo">鉁?<span id="combo">0</span>缁?/div>
                <div class="info-item info-attack">鈿旓笍 <span id="attackPower">0</span></div>
            </div>
            <div class="grid-container">
                <div class="grid-inner">
                    <div class="grid" id="grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS鏂囦欢 -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/match.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
